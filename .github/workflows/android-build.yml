name: Android Build

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: "17"
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: 'stable'
          cache: true

      - name: Create key.properties
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "keyPassword=$KEY_PASSWORD" > ./android/key.properties
          echo "storePassword=$KEY_STORE_PASSWORD" >> ./android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> ./android/key.properties

      - name: Load key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_JKS_RELEASE }}
        run: echo "$KEYSTORE" | base64 --decode > android/app/release-key.jks

      - name: Turn off analytics
        run: flutter config --no-analytics

      - name: Pub Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --flavor dev

      - name: Save APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 3
