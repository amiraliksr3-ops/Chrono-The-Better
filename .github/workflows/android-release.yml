name: Android Release

on:
  push:
    tags:
    - '*'
  workflow_dispatch:

# 4
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: "17"
          # cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: 'stable'
          cache: false

      - name: Create key.properties
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "keyPassword=$KEY_PASSWORD" > ./android/key.properties
          echo "storePassword=$KEY_STORE_PASSWORD" >> ./android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> ./android/key.properties

      - name: Load key
        run: echo "${{ secrets.KEYSTORE_JKS_RELEASE }}" | base64 --decode > android/app/release-key.jks

      - name: Extract version from tag
        uses: damienaicheh/extract-version-from-tag-action@v1.1.0

      - name: Turn off analytics
        run: flutter config --no-analytics

      - name: Clear cache
        run: |
          flutter clean
          rm -rf ~/.gradle/caches

      - name: Pub Get Packages
        run: flutter pub get

      - name: Build APPBUNDLE
        run: flutter build appbundle --flavor prod

      - name: Build APK
        run: flutter build apk --release --split-per-abi --flavor prod

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          # The Flutter CLI renames built APKs into
          # build/app/outputs/flutter-apk/app-<abi>-prod-release.apk. Copy them
          # under the final release names instead: baells.chrono-<abi>.apk
          mkdir -p out
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs were produced" >&2
            exit 1
          fi
          for f in "${apks[@]}"; do
            base=$(basename "$f")
            case "$base" in
              app-arm64-v8a-*)   abi=arm64-v8a ;;
              app-armeabi-v7a-*) abi=armeabi-v7a ;;
              app-x86_64-*)      abi=x86_64 ;;
              *)
                echo "Unexpected APK name: $base" >&2
                exit 1
                ;;
            esac
            cp "$f" "out/baells.chrono-${abi}.apk"
          done
          # With --flavor prod the bundle lands in bundle/prodRelease/, not
          # bundle/release/.
          aab=$(find build/app/outputs/bundle -name '*.aab' -print -quit)
          if [ -z "$aab" ]; then
            echo "No app bundle was produced" >&2
            exit 1
          fi
          cp "$aab" out/baells.chrono.aab

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>",
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature"]
                },
                {
                  "title": "## ✨ Enhancements",
                  "labels": ["enhancement"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["bug"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                }
              ]
            }

      - name: Create Github Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "out/baells.chrono-*.apk,out/baells.chrono.aab"
          body: ${{steps.github_release.outputs.changelog}}
          draft: true

